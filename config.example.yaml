search:
  keywords: []
  city: ""
  salary_min: 0
  salary_max: 0
  education: []
  experience: []
  veto_words: []
  collect_pages: 35
  city_filter_enabled: true          # 按目标城市过滤：采集后仅保留命中 target_cities 的岗位
  target_cities: ["厦门", "福州", "泉州"]  # 目标城市名（子串匹配岗位真实所在地 region）
resume:
  files: []
  file: ""
  info: ""
llm:
  api_key: ""
  base_url: "http://localhost:11434/v1"
  model: "qwen2.5:7b"
  temperature: 0.3
monitor:
  enabled: false
  interval_minutes: 300
browser:
  headless: true
  send_interval_min: 30
  send_interval_max: 60
platforms:
  # 多平台采集（对齐 Boss：非登录态优先，不足自动转入登录态兜底）。
  # engine: api/assume 非登录态优先（匿名无痕浏览器先试，采不到再转登录态）；
  #         playwright/authed 直接走登录态。
  # profile 留空时使用默认目录（~/.config/jobhunter-platform/<key>）；
  # 准备某个平台的登录态请运行一次：python src/login_profile.py <key>
  #（应届生/智联/51job 登录后才是稳定路径；智联/51job 的 city_codes 填检索城市码可精确定位城市）
  boss:
    enabled: true
  yingsheng:
    enabled: true
    profile: ""
    engine: api
  zhaopin:
    enabled: true
    profile: ""
    engine: api
    city_codes: {}
  "51job":
    enabled: true
    profile: ""
    engine: api
    city_codes: {}
  qiuzhifangzhou:
    enabled: true
    profile: ""
